LABEL arch64
TEXT HELP
Boot the ArcXOS Live Medium on BIOS.
It allows you to install ArcXOS or perform live usage.
ENDTEXT
MENU LABEL ArcXOS Live Medium (x86_64, BIOS)
LINUX /%INSTALL_DIR%/boot/x86_64/vmlinuz-linux
INITRD /%INSTALL_DIR%/boot/intel-ucode.img,/%INSTALL_DIR%/boot/amd-ucode.img,/%INSTALL_DIR%/boot/x86_64/initramfs-linux.img
APPEND archisobasedir=%INSTALL_DIR% archisolabel=%ARCHISO_LABEL%

LABEL arch64speech
TEXT HELP
Boot the ArcXOS Live Medium on BIOS with speakup screen reader.
It allows you to install ArcXOS or perform system maintenance with speech feedback.
ENDTEXT
MENU LABEL ArcXOS Live Medium (x86_64, BIOS) with ^speech
LINUX /%INSTALL_DIR%/boot/x86_64/vmlinuz-linux
INITRD /%INSTALL_DIR%/boot/intel-ucode.img,/%INSTALL_DIR%/boot/amd-ucode.img,/%INSTALL_DIR%/boot/x86_64/initramfs-linux.img
APPEND archisobasedir=%INSTALL_DIR% archisolabel=%ARCHISO_LABEL% accessibility=on
